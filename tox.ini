[tox]
envlist = py313, isort_bot, isort_tools, flake8, black_bot, black_tools
skipsdist = True

[gh-actions]
python =
    3.13: py313

[testenv]
basepython = python3.13
deps =
    black_bot: -r{toxinidir}/requirements/black.txt
    black_tools: -r{toxinidir}/requirements/black.txt
    isort_bot: -r{toxinidir}/requirements/isort.txt
    isort_tools: -r{toxinidir}/requirements/isort.txt
    flake8: -r{toxinidir}/requirements/flake8.txt
commands =
    isort_bot: isort -c bot
    isort_tools: isort -c tools
    flake8: flake8
    black_bot: black --check bot
    black_tools: black --check tools
